<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jorna — The South Asian Celebration Marketplace</title>
<meta name="description" content="Plan your whole celebration in one place — a matched team of vendors for your wedding or event, booked and paid for safely through escrow.">
<meta name="theme-color" content="#6B1226">
<link rel="canonical" href="https://jornaevents.com/">

<!-- The root goes straight to Home. Not to sign-in: browsing needs no account, so
     the product comes first and an account is asked for when someone tries to
     book. Straight to /app/browse/ rather than via /app/, which would only
     redirect here anyway — one navigation instead of two.

     The marketing page still exists at /help/ and is what the App Store's
     "Marketing URL" and any campaign link should point at. Redirecting the root
     means search engines index a redirect, so /help/ is the page with the
     content worth finding. -->
<meta http-equiv="refresh" content="0;url=/app/browse/">
<script>location.replace("/app/browse/");</script>

<style>
  html { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: #2A0C19; color: #F6ECE0;
    font: 500 16px/1.5 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    text-align: center; padding: 2rem;
  }
  a { color: #C69329; }
</style>
</head>
<body>
  <!-- Only seen if both the refresh and the script are blocked. -->
  <p>Taking you to Jorna… <a href="/app/browse/">Continue</a><br>
    <a href="/help/">Read about Jorna instead</a></p>
</body>
</html>
