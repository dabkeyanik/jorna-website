version: 2
updates:
  # One npm workspace — both apps, packages/shared, wrangler and the git
  # hooks — with one lockfile at the root.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minor/patch bumps arrive batched; a major version gets its own PR so
    # one breaking upgrade (ESLint 10 in #96) can't hold back the rest.
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*"]
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
