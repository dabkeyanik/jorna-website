version: 2
updates:
  # Each app's Next.js dependencies, grouped the same way for both.
  - package-ecosystem: "npm"
    directory: "/apps/client/web"
    schedule:
      interval: "weekly"
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*"]
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/apps/vendor/web"
    schedule:
      interval: "weekly"
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*"]
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 10

  # Deploy tooling (wrangler), per app, and the root's git hooks.
  - package-ecosystem: "npm"
    directories: ["/", "/apps/client", "/apps/vendor"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
