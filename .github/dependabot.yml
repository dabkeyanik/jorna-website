version: 2
updates:
  # One npm workspace — both apps, packages/shared, wrangler and the git
  # hooks — with one lockfile at the root.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*"]
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
