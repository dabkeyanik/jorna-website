name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm run install:app

      - name: Lint
        run: npm --prefix web run lint

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Test
        run: npm --prefix web run test

      # This repo has no escrow/Stripe checkout flow at all (contract
      # deposits are self-attested, paid off-platform) — matches what the
      # preview/deploy jobs below actually ship. NOT set for the e2e job:
      # its Stripe-gating specs intentionally exercise the escrow-on code
      # path, same as jorna-website keeps those tests passing under the
      # flag's true default while production itself ships it off.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ESCROW_ENABLED: "false"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm run install:app

      # Google's own apt repo for Chrome has intermittently served a
      # Packages.gz that doesn't match its Release file's advertised hash,
      # which fails `apt-get update` outright and takes this whole job down
      # before a single test runs — even though `--with-deps` never actually
      # needs a package from this repo (Playwright installs its own bundled
      # Chromium; this source is just preinstalled on the runner image).
      # `-f` so this is a no-op once the repo's index is healthy again.
      - name: Work around Google Chrome apt repo outages
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list

      - name: Install Playwright browsers
        run: npx --prefix web playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  preview:
    name: Deploy PR preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Same reason as the `deploy` job below: wrangler is a root
      # devDependency invoked via `npx --no-install`.
      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        run: npm run install:app

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ESCROW_ENABLED: "false"

      # A non-production --branch value makes this a Cloudflare Pages
      # *preview* deployment — left alone by the `deploy` job below, which
      # only promotes to production on --branch main. This does not reuse
      # scripts/deploy.mjs: that script hardcodes --branch main and its
      # multi-attempt stability-polling verification is tuned for
      # production, not a one-shot preview build.
      - name: Deploy preview
        run: npx --no-install wrangler pages deploy public --project-name jorna-vendor --branch "pr-${{ github.event.pull_request.number }}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = `https://pr-${prNumber}.jorna-vendor.pages.dev`;
            const marker = "<!-- pr-preview-comment -->";
            const body = `${marker}\n🔗 Preview: ${url}\n\nUses the production backend/DB — see [DEPLOY.md](../blob/main/DEPLOY.md) before exercising booking/payment flows.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # `wrangler` is a root-level devDependency (wrangler.jsonc lives at
      # the repo root, not in web/) and scripts/deploy.mjs invokes it via
      # `npx --no-install`, which refuses to auto-install — it only works
      # on a dev machine because a root `npm install` already happened at
      # least once (that's also what wires up husky). CI needs it explicit.
      - name: Install root dependencies
        run: npm ci

      # npm run deploy (scripts/deploy.mjs) builds, runs `wrangler pages
      # deploy`, then polls every route until it's stably serving 200 — see
      # DEPLOY.md. It exits non-zero on a bad deploy, which fails this job
      # visibly instead of leaving prod half-broken with a green Action.
      #
      # jornaevents.com + www.jornaevents.com are now attached (moved here
      # from jorna-website's jorna-events project). That zone's bot/WAF
      # protection 403s every request from GitHub Actions' runner IPs — same
      # issue jorna-website's DEPLOY.md documents — so CI verifies against
      # the WAF-free pages.dev URL instead; a human running `npm run deploy`
      # locally still verifies the real production domain (DEPLOY_DOMAIN
      # unset, falls back to the apex).
      - name: Deploy
        run: npm run deploy
        env:
          NEXT_PUBLIC_ESCROW_ENABLED: "false"
          DEPLOY_DOMAIN: https://jorna-vendor.pages.dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
